<style id="main-css">
:root{
  --ground:#E7E8E4;       /* RAL 7035 light grey */
  --panel:#F6F6F3;
  --ink:#1B2126;
  --muted:#5D666C;
  --line:#CDD0CA;
  --line-strong:#AEB3AC;
  --accent:#1D5FA0;       /* CAT6 blue */
  --accent-ink:#FFFFFF;
  --accent-soft:#DCE6F0;
  --earth:#7C9A1E;        /* earth-wire green */
  --warn:#A8560E;
  --warn-soft:#F4E4D2;
  --danger:#B3261E;
  --field:#FFFFFF;
  --shadow:0 1px 2px rgba(27,33,38,.06),0 6px 24px rgba(27,33,38,.06);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --ground:#15191C;--panel:#1D2226;--ink:#E6E8E4;--muted:#9AA3A8;--line:#2E353A;--line-strong:#434C52;
    --accent:#6FA8E0;--accent-ink:#0F1418;--accent-soft:#1E2F40;--earth:#A6C04A;--warn:#E3A15C;--warn-soft:#3A2A19;
    --danger:#F08A82;--field:#12161A;--shadow:0 1px 2px rgba(0,0,0,.3),0 6px 24px rgba(0,0,0,.25);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --ground:#15191C;--panel:#1D2226;--ink:#E6E8E4;--muted:#9AA3A8;--line:#2E353A;--line-strong:#434C52;
  --accent:#6FA8E0;--accent-ink:#0F1418;--accent-soft:#1E2F40;--earth:#A6C04A;--warn:#E3A15C;--warn-soft:#3A2A19;
  --danger:#F08A82;--field:#12161A;--shadow:0 1px 2px rgba(0,0,0,.3),0 6px 24px rgba(0,0,0,.25);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--ground);color:var(--ink);font-family:"IBM Plex Sans Hebrew","Arial Hebrew",Arial,sans-serif;font-size:15px;line-height:1.5}
.wrap{max-width:1180px;margin:0 auto;padding-inline:16px;padding-block:20px 60px}
.mono,.sku{font-family:"IBM Plex Mono",ui-monospace,Menlo,monospace;font-size:13px;letter-spacing:.01em}
.sku{direction:ltr;unicode-bidi:isolate;white-space:nowrap}
.num{font-variant-numeric:tabular-nums}
h1,h2,h3{margin:0;text-wrap:balance}

/* header */
.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 24px;border-bottom:2px solid var(--ink);padding-bottom:14px}
.brand{display:flex;align-items:center;gap:14px}
.rackmark{width:34px;height:44px;border:2px solid var(--ink);border-radius:3px;display:grid;grid-template-rows:repeat(5,1fr);gap:3px;padding:4px}
.rackmark i{display:block;background:var(--ink);border-radius:1px}
.rackmark i:nth-child(2){background:var(--accent)}
.rackmark i:nth-child(4){background:var(--earth)}
h1{font-size:26px;font-weight:700;letter-spacing:-.01em}
.sub{color:var(--muted);font-size:14px}
.status{font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--line-strong)}
.dot.ok{background:var(--earth)} .dot.local{background:var(--warn)}

nav.tabs{display:flex;gap:4px;margin-top:18px;flex-wrap:wrap}
nav.tabs button{appearance:none;border:1px solid var(--line);background:var(--panel);color:var(--ink);font:inherit;font-weight:600;padding:8px 14px;border-radius:6px;cursor:pointer}
nav.tabs button[aria-selected="true"]{background:var(--ink);color:var(--ground)}
nav.tabs button:hover:not([aria-selected="true"]){border-color:var(--line-strong);color:var(--ink)}
nav.tabs .count{font-family:"IBM Plex Mono",monospace;font-weight:400;font-size:12px;opacity:.7;margin-inline-start:4px}

section.view{margin-top:20px;display:grid;gap:18px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow)}

.pw-wrap{position:relative;display:flex;align-items:center;direction:ltr}

.pw-eye{position:absolute;right:6px;top:50%;transform:translateY(-50%);appearance:none;border:0;background:transparent;color:var(--muted);width:38px;height:38px;border-radius:8px;display:grid;place-items:center;cursor:pointer;padding:0}
.pw-eye:hover{background:var(--line)}.pw-eye.on{color:var(--accent)}.pw-eye.on .pw-slash{display:none}
body.locked .top .row,body.locked #tabs{display:none!important}
.login{max-width:560px;margin:56px auto;display:grid;gap:18px;padding:36px 36px 30px;border:1px solid var(--line);border-radius:16px;background:var(--card,var(--surface,#fff));box-shadow:0 14px 40px rgba(0,0,0,.10)}

.userchip{display:inline-flex;align-items:center;gap:6px;font-size:13px;padding:5px 10px;border:1px solid var(--line);border-radius:999px;white-space:nowrap}

.rolepill{font-size:12px;padding:2px 8px;border-radius:999px;border:1px solid var(--line)}

.onwrap{position:relative}.onbtn{display:inline-flex;align-items:center;gap:6px}

.onrow{display:flex;align-items:center;gap:8px;padding:7px 12px;font-size:14px}.onrow .rolepill{margin-inline-start:auto}
.ro-banner{margin:0 0 12px;padding:8px 12px;border-radius:8px;border:1px dashed var(--line-strong);color:var(--muted);font-size:13px}
input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
input[type=number]{-moz-appearance:textfield;appearance:textfield}
.res.add{border-top:1px dashed var(--line-strong)}

@media (prefers-reduced-motion:no-preference){.drawer{animation:slide .18s ease-out}@keyframes slide{from{transform:translateX(24px);opacity:.6}}}
@media (max-width:560px){h1{font-size:22px}.eline{grid-template-columns:1fr 70px auto}}

/* ===== איכות וספקים ===== */
.qc{border:1px solid var(--line-strong);border-radius:10px;padding:10px 12px;display:grid;gap:8px;background:var(--panel)}
.qc-h{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.qc-list{display:grid;gap:4px}
.qc-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:5px 8px;border-radius:8px;border:1px solid var(--line)}
.qc-row[data-v="ok"]{background:rgba(76,107,18,.08);border-color:rgba(76,107,18,.35)}
.qc-row[data-v="bad"]{background:var(--crit-soft);border-color:var(--crit)}
.qc-t{font-size:14px;min-width:0}
.qc-seg{display:inline-flex;border:1px solid var(--line-strong);border-radius:8px;overflow:hidden}
.qc-seg button{appearance:none;border:0;background:var(--panel);color:var(--ink);font:inherit;font-size:13px;font-weight:600;padding:5px 10px;cursor:pointer;white-space:nowrap}
.qc-seg button+button{border-inline-start:1px solid var(--line-strong)}
.qc-seg button[data-v="ok"][aria-pressed="true"]{background:var(--earth);color:#fff}
.qc-seg button[data-v="bad"][aria-pressed="true"]{background:var(--crit);color:#fff}
.qc-badge{display:inline-block;font-size:12px;font-weight:700;padding:1px 8px;border-radius:999px;border:1px solid;white-space:nowrap}
.qc-badge.ok{color:#2e6b1a;border-color:#2e6b1a;background:rgba(76,107,18,.08)}.qc-badge.bad{color:#b3261e;border-color:#b3261e;background:#fbe9e7}
.score{display:inline-block;min-width:34px;text-align:center;font-weight:700;padding:2px 8px;border-radius:999px;font-variant-numeric:tabular-nums}
.s-ok{background:rgba(76,107,18,.14);color:var(--earth)}.s-mid{background:var(--warn-soft);color:var(--warn)}.s-bad{background:var(--crit-soft);color:var(--crit)}
.trace{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px 18px}
.trace>div>span:first-child{display:block;font-size:12px;color:var(--muted);font-weight:700}
@media (max-width:700px){.qc-row{grid-template-columns:1fr}.qc-seg{width:100%}.qc-seg button{flex:1}}
/* ===== מספרים סידוריים ומדבקות ===== */
.snpick{border:1px solid var(--line-strong);border-radius:10px;padding:10px 12px;display:grid;gap:8px;background:var(--panel);margin:10px 0}
.snpick-c{display:grid;gap:6px;padding-top:6px;border-top:1px solid var(--line)}
.snpick-l{display:flex;flex-wrap:wrap;gap:6px}
.snchip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-strong);border-radius:8px;padding:4px 10px;cursor:pointer;background:var(--ground)}
.snchip input{width:auto;margin:0}.snchip.flash{outline:3px solid var(--earth)}.snchip:has(input:checked){border-color:var(--earth);background:rgba(76,107,18,.1)}
.lbl-prev{display:flex;gap:10px;flex-wrap:wrap}
.lbl-prev-1{width:70mm;height:25.4mm;background:#fff;color:#111;border:1px solid var(--line-strong);border-radius:6px;position:relative;box-shadow:var(--shadow)}
.lbl-prev-1 .tl{position:absolute;inset:0;padding:1.6mm 3mm 1.2mm;display:flex;flex-direction:column;justify-content:space-between;direction:ltr;overflow:hidden;font-family:Arial,sans-serif}
.lbl-prev-1 .tl-top{display:flex;align-items:center;gap:2mm;height:7.4mm}.lbl-prev-1 .tl-top img{height:7mm}
.lbl-prev-1 .tl-id{min-width:0;flex:1;text-align:right}.lbl-prev-1 .tl-sku{font-family:"Courier New",monospace;font-weight:700;font-size:9pt;line-height:1.05;white-space:nowrap;overflow:hidden}
.lbl-prev-1 .tl-sku small{font-size:6.5pt;font-weight:400}.lbl-prev-1 .tl-name{direction:rtl;font-size:6.6pt;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lbl-prev-1 .bc{width:100%;height:8.6mm;display:block}.lbl-prev-1 .tl-sn{font-family:"Courier New",monospace;font-weight:700;font-size:9.5pt;text-align:center;letter-spacing:.6px;line-height:1}
.lp-list{display:flex;flex-wrap:wrap;gap:6px;max-height:180px;overflow:auto}
.lp-i{display:inline-flex;gap:6px;align-items:center;border:1px solid var(--line);border-radius:8px;padding:4px 8px}.lp-i input{width:auto;margin:0}
.lp-sheet{display:grid;gap:3px;max-width:260px;direction:ltr}
.lp-sheet span{font-size:10px;text-align:center;border:1px solid var(--line);border-radius:3px;padding:2px 0;color:var(--muted)}
.lp-sheet span.used{background:var(--line);text-decoration:line-through}.lp-sheet span.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.lp-cal summary{cursor:pointer;font-weight:600}.lp-cal{display:grid;gap:8px}
/* ===== מצב המערכת ===== */
.sys-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.sys-t{border:1px solid var(--line);border-radius:10px;padding:8px 10px;display:grid;gap:2px;background:var(--panel)}
.sys-t>span{font-size:12px;color:var(--muted);font-weight:700}.sys-t b{font-size:18px;font-variant-numeric:tabular-nums}.sys-t small{font-size:12px;color:var(--muted)}
.sys-bar-h{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:baseline;margin-top:4px}
.sys-bar{height:12px;border-radius:999px;background:var(--line);overflow:hidden}
.sys-fill{height:100%;border-radius:999px}.sys-fill.ok{background:var(--earth)}.sys-fill.warn{background:var(--warn)}.sys-fill.crit{background:var(--crit)}
.sys-msg{font-size:13.5px;font-weight:600}.sys-msg.ok{color:var(--earth)}.sys-msg.warn{color:var(--warn)}.sys-msg.crit{color:var(--crit)}
/* ===== מודולים ===== */
.featlist{display:grid;gap:6px}
.featrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:10px;cursor:pointer}
.featrow>span:first-child{display:grid;gap:2px}
.tgl-w{display:inline-flex;align-items:center;gap:8px}
.tgl-s{font-size:12.5px;font-weight:700;color:var(--muted);min-width:42px;text-align:end}
.featrow:has(.tgl:checked) .tgl-s{color:var(--earth)}
input.tgl{appearance:none;-webkit-appearance:none;width:48px!important;min-width:48px;height:28px;margin:0;padding:0;border-radius:999px;background:var(--line-strong);position:relative;cursor:pointer;transition:background .18s;border:0;flex:none}
input.tgl::after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:inset-inline-start .18s}
input.tgl:checked{background:var(--earth)}
input.tgl:checked::after{inset-inline-start:23px}
input.tgl:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.featrow:has(input:checked){border-color:var(--earth);background:rgba(76,107,18,.07)}
/* ===== אודות – תפקידים ===== */
.ab-roles{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin-bottom:6px}
.ab-role{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--panel)}
.ab-role h4{margin:0 0 4px;font-size:15px}.ab-role p{margin:0 0 6px;font-size:13px;color:var(--muted)}
.ab-role ul{margin:0;padding-inline-start:18px;font-size:13px;display:grid;gap:3px}
/* ===== תעודות השלמה ===== */
.tl-row.tl-sub{margin-inline-start:26px;border-inline-start:3px solid var(--accent);padding-inline-start:10px}
/* ===== סיכום חוסרים ===== */
.drawer.wide{width:min(1120px,100%)}
.ss-wrap{border:1px solid var(--line);border-radius:10px;overflow:auto;background:#fff}
/* ===== GR ===== */
.gr{display:flex;align-items:center;gap:4px;direction:ltr;justify-content:flex-start}
.gr-p{font-family:var(--mono,ui-monospace,monospace);font-weight:700;font-size:16px;padding-inline-end:4px;color:var(--ink)}
.grf{grid-column:span 2;min-width:0}
.gr .gr-c{width:30px;flex:0 1 30px;min-width:18px;height:38px;padding:0;text-align:center;font-family:var(--mono,ui-monospace,monospace);font-size:17px;font-weight:600}
@media (max-width:700px){.grf{grid-column:auto}.gr{gap:3px}.gr .gr-c{width:0!important;min-width:0!important;flex:1 1 0;height:42px;font-size:18px}}
/* ===== פריטים חלופיים ===== */
.altbtn{border-color:var(--accent);color:var(--accent)}
.altopt{display:grid;grid-template-columns:auto auto minmax(0,1fr);gap:8px;align-items:center;padding:8px 10px;border:1px solid var(--line);border-radius:8px;cursor:pointer;background:var(--panel)}
.altopt:has(input:checked){border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.altopt input{width:auto}
.altstrip{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding-top:10px;padding-bottom:10px;background:var(--accent-soft,rgba(42,120,214,.08));border-bottom:1px solid var(--line)}
.altchip{display:inline-flex;gap:4px;align-items:center;padding:3px 10px;border:1px solid var(--line-strong);border-radius:999px;background:var(--panel);font-size:13px;direction:rtl}
/* ===== הנדסה – גרסאות ===== */
.revpill{display:inline-block;font-family:"IBM Plex Mono",monospace;font-size:11.5px;font-weight:600;padding:1px 7px;border-radius:999px;border:1px solid var(--line-strong);color:var(--muted);white-space:nowrap;direction:ltr}
.revpill.cur{border-color:var(--accent);color:var(--accent)}
.revbox{display:grid;gap:8px;border:1px solid var(--line);border-radius:10px;padding:12px;background:var(--ground)}
.revhead{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.revpend{display:grid;gap:8px;border:1px dashed var(--accent);border-radius:8px;padding:10px;background:var(--panel)}
.revlist{display:grid;gap:10px;margin-top:8px}
.revrow{border-inline-start:3px solid var(--line-strong);padding-inline-start:10px;display:grid;gap:4px}
.revrow-h{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px}
.revnote{font-size:13px}
.dlist{display:grid;gap:3px}
.dline{display:grid;grid-template-columns:16px auto minmax(0,1fr) auto;gap:8px;align-items:center;font-size:12.5px;padding:3px 6px;border-radius:5px}
.dline .dname{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted)}
.dline .dq{font-variant-numeric:tabular-nums;font-weight:600}
.dline .dsym{font-weight:700;text-align:center}
.d-add{background:color-mix(in srgb,#2e9e5b 12%,transparent)}.d-add .dsym{color:#2e9e5b}
.d-del{background:color-mix(in srgb,#d33 10%,transparent)}.d-del .dsym{color:var(--danger)}
.d-chg{background:color-mix(in srgb,#f2c200 14%,transparent)}.d-chg .dsym{color:var(--warn)}
details summary{cursor:pointer;font-weight:600;font-size:14px}
/* ===== דשבורד ===== */
:root{--s1:#2a78d6;--s2:#eb6834;--crit:#c62828;--crit-soft:#fbe9e7}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--s1:#3987e5;--s2:#d95926;--crit:#ef5350;--crit-soft:#3a1f1f}}
:root[data-theme="dark"]{--s1:#3987e5;--s2:#d95926;--crit:#ef5350;--crit-soft:#3a1f1f}
.dash{display:grid;gap:16px}
.dash-filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
.seg{display:inline-flex;border:1px solid var(--line-strong);border-radius:8px;overflow:hidden}
.seg button{appearance:none;border:0;background:var(--panel);color:var(--ink);font:inherit;font-size:14px;font-weight:600;padding:7px 14px;cursor:pointer}
.seg button+button{border-inline-start:1px solid var(--line-strong)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--ground)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:grid;gap:4px;text-align:start}
.kpi .k-l{font-size:13px;color:var(--muted);font-weight:600}
.kpi .k-v{font-size:30px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1;color:var(--ink)}
.kpi .k-s{font-size:12.5px;color:var(--muted)}
.kpi.crit{border-color:var(--crit);background:var(--crit-soft)}
.kpi.crit .k-l{color:var(--crit)}
button.kpi{font:inherit;cursor:pointer;appearance:none}
.dgrid{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:980px){.dgrid{grid-template-columns:minmax(0,1fr)}}
.chart-card .card-h h2{font-size:16px}
.chart-sub{font-size:12.5px;color:var(--muted);font-weight:400}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:12px;height:12px;border-radius:3px;display:inline-block}
.vchart{width:100%;height:auto;display:block;direction:ltr}
.vchart text{font-family:inherit;fill:var(--muted);font-size:11px}
.vchart .gl{stroke:var(--line);stroke-width:1}
.vchart .hit{fill:transparent}
.vchart .hl{fill:var(--ink);transition:opacity .12s}
.vchart g.col:hover .hl{opacity:1!important}
.hbars{display:grid;gap:10px}
.hb{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:3px 10px;align-items:center}
.hb-l{font-size:13.5px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hb-l .sku{margin-inline-end:6px}
.hb-v{font-size:13px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.hb-t{grid-column:1/-1;height:10px;background:var(--ground);border-radius:4px;overflow:hidden}

  .card-b{padding:12px}
  .strip div{flex:1 1 45%;padding:8px 10px}

function supplierPerf(months) {
  const from = monthKeys(months || 12)[0] + "-01", lim = delayDays(), A = {};
  const get = a => A[a] = A[a] || { a, cabs: 0, sumDays: 0, onTime: 0, inc: 0, rcpts: 0, qcN: 0, qcPass: 0, orders: new Set(), refs: new Map(), delayed: 0, sent: 0, atSup: 0, fails: {} };
  allOrderEntries().forEach(e => {
    const o = e.order, f = firstShipDate(o), a = e.assembler || "ללא ספק";
    if (f) { const qty = (e.cabs || []).reduce((x, c) => x + (Number(c.qty) || 0), 0), got = (e.cabs || []).reduce((x, c) => x + Math.min(Number(c.qty) || 0, Number(c.rcv) || 0), 0), pend = Math.max(0, qty - got);
      if (f >= from || pend) { const g0 = get(a); g0.sent += qty; g0.atSup += pend; if (pend) { const rf = refNo(o) || "—", cur = g0.refs.get(rf) || { id: e.id, ref: rf, cabs: 0, days: daysBetween(f, today()) }; g0.refs.set(rf, cur); } } }
    (o.receipts || []).forEach(r => {
      if (r.kind === "complete" || !r.date || r.date < from) return;
      const n = Object.values(r.lines || {}).reduce((x, q) => x + (Number(q) || 0), 0); if (!n) return;
      const g = get(a), d = f ? Math.max(0, daysBetween(f, r.date)) : 0;
      g.cabs += n; g.sumDays += d * n; if (d <= lim) g.onTime += n; g.inc += Object.values(r.incomplete || {}).reduce((x, q) => x + (Number(q) || 0), 0); g.rcpts++; g.orders.add(e.id); { const rf = refNo(o) || "—", cur = g.refs.get(rf) || { id: e.id, ref: rf, cabs: 0, days: d }; cur.cabs += n; cur.days = Math.max(cur.days, d); g.refs.set(rf, cur); }
      if (r.qc) { g.qcN++; if (r.qc.result === "pass") g.qcPass++; (r.qc.items || []).forEach(x => { if (x.v === "bad") g.fails[x.t] = (g.fails[x.t] || 0) + 1; }); }
    });
  });
  delayedList().forEach(x => { get(x.e.assembler || "ללא ספק").delayed += x.pend; });
  return Object.values(A).map(g => {
    const onTimeP = g.cabs ? g.onTime / g.cabs * 100 : null, compP = g.cabs ? (g.cabs - g.inc) / g.cabs * 100 : null, qcP = g.qcN ? g.qcPass / g.qcN * 100 : null;
    const score = g.cabs ? Math.round(0.4 * onTimeP + 0.3 * compP + 0.3 * (qcP === null ? compP : qcP)) : null;
    return { ...g, orders: g.orders.size, refs: [...g.refs.values()], avg: g.cabs ? g.sumDays / g.cabs : null, onTimeP, compP, qcP, score, topFail: Object.entries(g.fails).sort((x, y) => y[1] - x[1]).slice(0, 3) };
  }).sort((x, y) => (y.score ?? -1) - (x.score ?? -1));
}

function atSupData(f) {
  f = f || {}; const now = today(), types = new Map(), asms = new Set();
  allOrderEntries().forEach(e => {
    const o = e.order || {}, ships = o.shipments || []; if (!ships.length) return;
    const since = firstShipDate(o) || e.date || "", days = since ? Math.max(0, daysBetween(since, now)) : 0;
    const asm = e.assembler || "ללא ספק"; asms.add(asm);
    if (f.asm && asm !== f.asm) return;
    const rcvSn = new Set((o.receipts || []).flatMap(r => Object.values(r.serials || {}).flat()));
    const notes = ships.map((sh, i) => `${sh.docNo || (e.ref || "—") + "/" + shipNoAt(o, i)}${sh.date ? " · " + fmtDate(sh.date) : ""}${sh.completion ? " (השלמה)" : ""}`);
    (e.cabs || []).forEach(c => {
      const qty = Number(c.qty) || 0, rcv = Math.min(qty, Number(c.rcv) || 0), pend = qty - rcv; if (pend <= 0) return;
      const k = c.sku || "?", t = types.get(k) || { sku: k, name: c.name || "", rev: c.rev || "", total: 0, bySup: {}, orders: [], oldest: 0 };
      t.total += pend; t.bySup[asm] = (t.bySup[asm] || 0) + pend; t.oldest = Math.max(t.oldest, days);
      const sns = feat("sn") ? ((o.serials || {})[c.cabinetId] || []).filter(x => !rcvSn.has(x)) : [];
      t.orders.push({ e, id: e.id, ref: e.ref || "—", po: o.po || "", title: e.title || "", asm, date: e.date || "", since, days, qty, rcv, pend, inc: Number(c.inc) || 0, notes, lastRc: ((o.receipts || []).slice(-1)[0] || {}).date || "", short: (e.short || []).length, sns });
      types.set(k, t);
    });
  });
  const list = [...types.values()].map(t => ({ ...t, orders: t.orders.sort((a, b) => b.days - a.days) })).sort((a, b) => b.total - a.total || collator.compare(a.sku, b.sku));
  const allOrd = new Set(list.flatMap(t => t.orders.map(x => x.id)));
  return { list, total: list.reduce((a, t) => a + t.total, 0), orders: allOrd.size, sups: new Set(list.flatMap(t => Object.keys(t.bySup))).size, oldest: Math.max(0, ...list.map(t => t.oldest)), asms: [...asms].sort(collator.compare), date: now };
}

function searchItems(q, limit = 40) {
  const toks = String(q || "").trim().toLowerCase().split(/\s+/).filter(Boolean);
  if (!toks.length) return { hits: [], total: 0 };
  const hits = [];
  for (const it of S.items) {
    const sku = String(it.sku || "").toLowerCase(), hay = `${sku} ${String(it.name || "").toLowerCase()} ${String(it.category || "").toLowerCase()} ${String(it.supplier || "").toLowerCase()}`;
    if (toks.every(t => hay.includes(t))) hits.push({ it, score: sku === toks[0] ? 0 : sku.startsWith(toks[0]) ? 1 : sku.includes(toks[0]) ? 2 : 3 });
  }
  hits.sort((a, b) => a.score - b.score || collator.compare(a.it.sku || "", b.it.sku || ""));
  return { hits: hits.slice(0, limit).map(h => h.it), total: hits.length };
}

  });
  return out;
}

    const res = planImport(d.rows, m); draft.imp = { ...d, ...res, rows: d.rows }; refreshDev(); return;
  }
  if (t.id === "cab-imp-file" && t.files[0] && draft && draft.type === "cab") { readCabFields(); const f = t.files[0]; cabImportFile(f).then(() => renderCab()); return; }
  if (t.id === "restore-file" && t.files[0]) {
    const f = t.files[0];
    f.text().then(txt => {
      try { const j = JSON.parse(txt); if (!Array.isArray(j.items)) throw 0; draft.restore = { data: { items: j.items || [], cabinets: j.cabinets || [], assemblers: j.assemblers || [], log: j.log || [], order: j.order || null, settings: j.settings || null } }; }
      catch (e) { draft.restore = { error: `הקובץ "${f.name}" הוא לא קובץ גיבוי של האפליקציה. בחר את הקובץ ששמו מתחיל ב-BOM-backup.` }; }
      refreshDev();
    });
    return;
  }
  if (t.classList && t.classList.contains("h-asm") && t.value) {
    (async () => { const pk = compOrd(t.dataset.id); if (!pk) return; const ord = pk.ord, a = byId(S.assemblers, t.value); ord.assemblerId = t.value; ord.manufacturer = a ? a.name : "";
      await archiveNow(JSON.parse(JSON.stringify(ord))); if (pk.isCur) { S.order = ord; saveOrderSoon(); } logAct("עדכון ספק הרכבה", `${refNo(ord) || ""} · ${ord.manufacturer}`); render(); toast(`ספק ההרכבה עודכן: ${ord.manufacturer}`); })();
    return;
  }
  if (t.classList && t.classList.contains("lp-c")) { lpSheetMark(); return; }
  if (t.classList && t.classList.contains("sn-c")) { const b = t.closest(".snpick-c"); if (b) b.dataset.touched = "1"; snPickSync(t.dataset.cab); return; }
  if (t.id === "sys-year") { if (role() !== "dev") return; S.settings = { ...S.settings, sysCabsYear: Math.max(0, Number(t.value) || 0) }; saveSettings(); setTimeout(sysRefreshSec, 30); return; }
  if (t.id === "as-asm") { S.asF = { asm: t.value }; openAtSup(); return; }
  if (t.id === "ss-asm" || t.id === "ss-cab") { S.ssF = { ...(S.ssF || {}), [t.id === "ss-asm" ? "asm" : "cab"]: t.value }; openShortSummary(); return; }
  if (t.id === "h-from") { S.hFrom = t.value; render(); return; }
  if (t.id === "h-to") { S.hTo = t.value; render(); return; }
  if (t.id === "groupBy") { S.groupBy = t.value; render(); return; }
  if (t.id === "supFilter") { S.supplierFilter = t.value; render(); return; }
  if (t.dataset.cl === "item") { draft.data.lines[Number(t.dataset.i)].itemId = t.value; return; }
  if (t.dataset.cl === "qty" && draft && draft.type === "cab") { cabRefreshInline(); return; }
  if (t.dataset.order !== undefined) {
    const o = S.order, i = Number(t.dataset.i);
    if (t.dataset.kind === "line") o.lines[i].cabinetId = t.value;
    else if (t.dataset.kind === "extra") o.extras[i].itemId = t.value;
    else if (t.dataset.kind === "doctype") { o.docType = t.value; }
    else if (t.dataset.kind === "asm") { o.assemblerId = t.value; const a = byId(S.assemblers, t.value); o.manufacturer = a ? a.name : ""; }
    else return;
    saveOrderSoon(); render();
  }
});
/* Enter בשדה כמות בעריכת ארון – מעבר לשורה הבאה */
document.addEventListener("keydown", e => {
  const t = e.target; if (e.key !== "Enter" || !t.classList || !t.classList.contains("qty") || !t.closest(".eline.cline")) return;
  e.preventDefault();
  const all = [...document.querySelectorAll(".eline.cline .qty")], i = all.indexOf(t);

/* הדבקת כמה מק״טים (עמודה מאקסל) לשדה החיפוש בעריכת ארון – מוסיף את כולם עם התיאור מהקטלוג */
document.addEventListener("paste", e => {
  const t = e.target; if (!t || t.id !== "cl-search" || !draft || draft.type !== "cab") return;
  const txt = (e.clipboardData || window.clipboardData).getData("text") || "";
  if (!/\n/.test(txt.trim()) && !/\t/.test(txt)) return;
  e.preventDefault(); readCabFields(); cabImportText(txt); renderCab();
});
document.addEventListener("paste", e => {
  const t = e.target; if (!t.classList || !t.classList.contains("digit")) return;
  if (t.classList.contains("pbox")) {
    const txt = ((e.clipboardData || window.clipboardData).getData("text") || "").toUpperCase().replace(/[^A-Z0-9]/g, "");
    if (!txt) return; e.preventDefault();
    const start = txt.length >= 7 ? 0 : Number(t.dataset.i);
    [...txt].slice(0, 7 - start).forEach((c, k) => { const el = $(`#p-${start + k}`); if (el) el.value = c; });
    const last = $(`#p-${Math.min(6, start + txt.length - 1)}`); last.dispatchEvent(new Event("input", { bubbles: true })); last.focus();
    return;
  }
  const txt = (e.clipboardData || window.clipboardData).getData("text") || "";
  const m = txt.trim().toUpperCase().match(/^(PO|WR)?\s*-?\s*(\d{1,9})/); if (!m) return;
  e.preventDefault();
  if (m[1] === "PO") { S.order.po = "PO" + m[2]; saveOrderSoon(); render(); return; }
  const start = m[1] ? 0 : Number(t.dataset.i);
  [...m[2]].forEach((d, k) => { const el = $(`#d-${start + k}`); if (el) el.value = d; });
  const last = $(`#d-${Math.min(8, start + m[2].length)}`); last && last.focus();
  t.dispatchEvent(new Event("input", { bubbles: true }));
});
(() => {
  const box = document.createElement("div"); box.id = "tipbox"; box.hidden = true; document.body.appendChild(box);
  const show = el => {
    const html = S.tips && S.tips[el.dataset.tip]; if (!html) return;
    box.innerHTML = html; box.hidden = false;
    const r = el.getBoundingClientRect(), bw = box.offsetWidth, bh = box.offsetHeight;
    let left = r.left + r.width / 2 - bw / 2; left = Math.max(8, Math.min(left, window.innerWidth - bw - 8));
    let top = r.top - bh - 8; if (top < 8) top = r.bottom + 8;
    box.style.left = left + "px"; box.style.top = top + "px";
  };
  document.addEventListener("mouseover", e => { const el = e.target.closest && e.target.closest("[data-tip]"); if (el) show(el); });
  document.addEventListener("mouseout", e => { const el = e.target.closest && e.target.closest("[data-tip]"); if (el && !el.contains(e.relatedTarget)) box.hidden = true; });
  document.addEventListener("focusin", e => { const el = e.target.closest && e.target.closest("[data-tip]"); if (el) show(el); });
  document.addEventListener("focusout", e => { if (e.target.closest && e.target.closest("[data-tip]")) box.hidden = true; });
  window.addEventListener("scroll", () => { box.hidden = true; }, true);
})();
document.addEventListener("focusout", e => {
  // pick up remote order changes deferred while typing
  if (e.target.closest && e.target.closest("[data-order]")) setTimeout(() => {
    if (S.mode !== "db" || (document.activeElement && document.activeElement.closest && document.activeElement.closest("[data-order]"))) return;
    const d = S.deferredOrder; S.deferredOrder = null;
    if (d && S.order) {
      /* מיזוג: שדות שהמשתמש שינה נשארים שלו, שאר השדות מתעדכנים מהשינוי שהגיע ממכשיר אחר */
      let base = {}, inc = {}; try { base = JSON.parse(d.base || "{}"); inc = JSON.parse(d.incoming); } catch (x) {}
      const m = { ...inc }; Object.keys({ ...S.order, ...inc }).forEach(k => { if (JSON.stringify(S.order[k]) !== JSON.stringify(base[k])) m[k] = S.order[k]; });
      S.order = m; saveOrderSoon();
    }
    render();
  }, 50);
});
document.addEventListener("keydown", e => {
  if (e.target && (e.target.id === "login-pass" || e.target.id === "login-name") && e.key === "Enter") { e.preventDefault(); if (e.target.id === "login-name" && !$("#login-pass").value) { $("#login-pass").focus(); return; } doLogin(); return; }
  if (e.target && e.target.id === "sync-pass" && e.key === "Enter") { e.preventDefault(); const b = document.querySelector('[data-act="sync-unlock"]'); b && b.click(); return; }
  if (e.key === "Escape" && S.devMenu) { S.devMenu = false; render(); return; }
  if (e.target && e.target.classList && e.target.classList.contains("digit")) {
    const i = Number(e.target.dataset.i), pf = e.target.classList.contains("pbox") ? "p" : "d", max = pf === "p" ? 6 : 8;
    if (e.key === "Backspace" && !e.target.value && i > 0) { e.preventDefault(); const p = $(`#${pf}-${i - 1}`); p.value = ""; p.dispatchEvent(new Event("input", { bubbles: true })); $(`#${pf}-${i - 1}`).focus(); return; }
    if (e.key === "ArrowLeft" && i > 0) { $(`#${pf}-${i - 1}`).focus(); return; }
    if (e.key === "ArrowRight" && i < max) { $(`#${pf}-${i + 1}`).focus(); return; }
  }
  if (e.target && /^qa-(sku|name|cat)$/.test(e.target.id) && e.key === "Enter") { e.preventDefault(); const b = document.querySelector('[data-act="qa-save"]'); b && b.click(); return; }
  if (e.target && (e.target.id === "cl-search" || e.target.id === "ex-search" || e.target.id === "c-sku")) {
    const box = $(e.target.id === "cl-search" ? "#cl-results" : e.target.id === "c-sku" ? "#csku-results" : "#ex-results"); const opts = box ? [...box.querySelectorAll(".res")] : [];
    if (!opts.length) return;
    let i = opts.findIndex(x => x.classList.contains("hl"));
    if (e.key === "ArrowDown" || e.key === "ArrowUp") { e.preventDefault(); opts[i]?.classList.remove("hl"); i = (i + (e.key === "ArrowDown" ? 1 : -1) + opts.length) % opts.length; opts[i].classList.add("hl"); opts[i].scrollIntoView({ block: "nearest" }); return; }
    if (e.key === "Enter") { e.preventDefault(); (opts[i] || opts[0]).click(); return; }
  } if (e.key === "Escape" && draft) closeDrawer(); });

{ const st = document.createElement("style"); st.textContent = NOTE_CSS; document.head.appendChild(st); }
startSpaceObserver();
boot();
setTimeout(() => { if (S.space !== "cab") respace(document.body); }, 0);
