<title>בום ארונות תקשורת</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Hebrew:wght@400;500;600;700&display=swap">
<style id="main-css">
:root{
  --ground:#E7E8E4;       /* RAL 7035 light grey */
  --panel:#F6F6F3;
  --ink:#1B2126;
  --muted:#5D666C;
  --line:#CDD0CA;
  --line-strong:#AEB3AC;
  --accent:#1D5FA0;       /* CAT6 blue */
  --accent-ink:#FFFFFF;
  --accent-soft:#DCE6F0;
  --earth:#7C9A1E;        /* earth-wire green */
  --warn:#A8560E;
  --warn-soft:#F4E4D2;
  --danger:#B3261E;
  --field:#FFFFFF;
  --shadow:0 1px 2px rgba(27,33,38,.06),0 6px 24px rgba(27,33,38,.06);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --ground:#15191C;--panel:#1D2226;--ink:#E6E8E4;--muted:#9AA3A8;--line:#2E353A;--line-strong:#434C52;
    --accent:#6FA8E0;--accent-ink:#0F1418;--accent-soft:#1E2F40;--earth:#A6C04A;--warn:#E3A15C;--warn-soft:#3A2A19;
    --danger:#F08A82;--field:#12161A;--shadow:0 1px 2px rgba(0,0,0,.3),0 6px 24px rgba(0,0,0,.25);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --ground:#15191C;--panel:#1D2226;--ink:#E6E8E4;--muted:#9AA3A8;--line:#2E353A;--line-strong:#434C52;
  --accent:#6FA8E0;--accent-ink:#0F1418;--accent-soft:#1E2F40;--earth:#A6C04A;--warn:#E3A15C;--warn-soft:#3A2A19;
  --danger:#F08A82;--field:#12161A;--shadow:0 1px 2px rgba(0,0,0,.3),0 6px 24px rgba(0,0,0,.25);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--ground);color:var(--ink);font-family:"IBM Plex Sans Hebrew","Arial Hebrew",Arial,sans-serif;font-size:15px;line-height:1.5}
.wrap{max-width:1180px;margin:0 auto;padding-inline:16px;padding-block:20px 60px}
.mono,.sku{font-family:"IBM Plex Mono",ui-monospace,Menlo,monospace;font-size:13px;letter-spacing:.01em}
.sku{direction:ltr;unicode-bidi:isolate;white-space:nowrap}
.num{font-variant-numeric:tabular-nums}
h1,h2,h3{margin:0;text-wrap:balance}

/* header */
.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 24px;border-bottom:2px solid var(--ink);padding-bottom:14px}
.brand{display:flex;align-items:center;gap:14px}
.rackmark{width:34px;height:44px;border:2px solid var(--ink);border-radius:3px;display:grid;grid-template-rows:repeat(5,1fr);gap:3px;padding:4px}
.rackmark i{display:block;background:var(--ink);border-radius:1px}
.rackmark i:nth-child(2){background:var(--accent)}
.rackmark i:nth-child(4){background:var(--earth)}
h1{font-size:26px;font-weight:700;letter-spacing:-.01em}
.sub{color:var(--muted);font-size:14px}
.status{font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--line-strong)}
.dot.ok{background:var(--earth)} .dot.local{background:var(--warn)}

nav.tabs{display:flex;gap:4px;margin-top:18px;flex-wrap:wrap}
nav.tabs button{appearance:none;border:1px solid var(--line);background:var(--panel);color:var(--ink);font:inherit;font-weight:600;padding:8px 14px;border-radius:6px;cursor:pointer}
nav.tabs button[aria-selected="true"]{background:var(--ink);color:var(--ground)}
nav.tabs button:hover:not([aria-selected="true"]){border-color:var(--line-strong);color:var(--ink)}
nav.tabs .count{font-family:"IBM Plex Mono",monospace;font-weight:400;font-size:12px;opacity:.7;margin-inline-start:4px}

section.view{margin-top:20px;display:grid;gap:18px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow)}
.card-h{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.card-h h2{font-size:17px;font-weight:700}
.card-b{padding:16px}
.label{font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.04em}

/* forms */
input,select,textarea{font:inherit;color:var(--ink);background:var(--field);border:1px solid var(--line-strong);border-radius:6px;padding:7px 10px;min-width:0;width:100%}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
input.qty{width:96px;padding-inline:6px;direction:ltr;text-align:center;font-variant-numeric:tabular-nums}
.field{display:grid;gap:4px}
.grid-form{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.btn{appearance:none;font:inherit;font-weight:600;font-size:14px;border-radius:6px;padding:7px 14px;cursor:pointer;border:1px solid var(--line-strong);background:var(--panel);color:var(--ink);display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{border-color:transparent;background:none;color:var(--muted);padding:5px 8px}
.btn.ghost:hover{color:var(--ink);border-color:var(--line)}
.btn.danger{color:var(--danger)}
.btn.arm{background:var(--danger);border-color:var(--danger);color:#fff}
.btn:disabled{opacity:.5;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}

/* tables */
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{font-size:12px;font-weight:600;color:var(--muted);text-align:start;padding:8px 10px;border-bottom:1px solid var(--line-strong);white-space:nowrap;letter-spacing:.03em}
td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:none}
td.qtycell{font-weight:700;font-size:16px;text-align:center}
.grp td{background:var(--accent-soft);font-weight:700;font-size:13px;padding-block:6px}
.from{font-size:12.5px;color:var(--muted)}
.chip{display:inline-block;font-size:12px;padding:1px 8px;border-radius:99px;background:var(--ground);border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.chip.warn{background:var(--warn-soft);border-color:transparent;color:var(--warn)}

/* summary strip */
.strip{display:flex;flex-wrap:wrap;gap:0;border:1px solid var(--line);border-radius:8px;background:var(--panel);overflow:hidden}
.strip div{flex:1 1 140px;padding:10px 16px;border-inline-start:1px solid var(--line)}
.strip div:first-child{border-inline-start:none}
.strip b{display:block;font-size:22px;font-variant-numeric:tabular-nums;font-weight:700}

/* order layout */
.order-grid{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:900px){.order-grid{grid-template-columns:1fr}}
.lines{display:grid;gap:8px}
.line{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center}

/* cabinet list */
.cabs{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
.cab{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px;display:grid;gap:10px;align-content:start;cursor:pointer;text-align:start;font:inherit;color:inherit}
.cab:hover{border-color:var(--ink)}
.cab h3{font-size:16px}
.umeter{height:8px;border-radius:2px;background:repeating-linear-gradient(90deg,var(--line) 0 3px,transparent 3px 5px);position:relative;overflow:hidden}
.umeter span{position:absolute;inset-block:0;inset-inline-start:0;background:var(--accent)}
.umeter.over span{background:var(--danger)}

/* editor drawer */
.scrim{position:fixed;inset:0;background:rgba(10,14,17,.35);z-index:20;display:flex;justify-content:flex-end}
.drawer{background:var(--panel);width:min(720px,100%);height:100%;overflow-y:auto;box-shadow:var(--shadow);display:flex;flex-direction:column}
.drawer-h{position:sticky;top:0;background:var(--panel);border-bottom:1px solid var(--line);padding:14px 16px;padding-top:calc(14px + env(safe-area-inset-top,0px));display:flex;justify-content:space-between;align-items:center;gap:10px;z-index:1}
.drawer-b{padding:16px;display:grid;gap:18px}
.drawer-f{margin-top:auto;position:sticky;bottom:0;background:var(--panel);border-top:1px solid var(--line);padding:12px 16px;padding-bottom:calc(12px + env(safe-area-inset-bottom,0px));display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between}
.eline{display:grid;grid-template-columns:minmax(0,1fr) 80px auto;gap:8px;align-items:center}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}
.stat{font-size:12px;font-weight:600;padding:1px 8px;border-radius:99px;white-space:nowrap}
.stat.done{background:color-mix(in srgb,var(--earth) 18%,transparent);color:var(--earth)}
.stat.part{background:var(--warn-soft);color:var(--warn)}
.stat.wait{background:var(--ground);color:var(--muted);border:1px solid var(--line)}
tr.shipped td{color:var(--muted)}
td.c{text-align:center}
input.now{width:96px;padding-inline:6px;direction:ltr;text-align:center;font-weight:700;font-variant-numeric:tabular-nums;border-color:var(--accent)}
input.now.zero{border-color:var(--line-strong);font-weight:400;color:var(--muted)}
.ship{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.ship:last-child{border-bottom:none}
.shipno{font-family:"IBM Plex Mono",monospace;font-weight:500;background:var(--ink);color:var(--ground);border-radius:4px;padding:2px 7px;font-size:12px}
.progress{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.progress span{display:block;height:100%;background:var(--earth)}
.sendbar{display:flex;flex-wrap:wrap;gap:10px;align-items:end;justify-content:space-between;padding:14px 16px;border-top:2px solid var(--accent);background:var(--accent-soft)}
#note-prev .dn{padding:22px}
.devbtn{font-family:"IBM Plex Mono",monospace;font-size:13px;border-style:dashed}
.asms{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.asm{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px;display:grid;gap:6px;align-content:start;cursor:pointer;text-align:start;font:inherit;color:inherit}
.asm:hover{border-color:var(--ink)}
.asm h3{font-size:16px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;font-size:13.5px}
.kv span:nth-child(odd){color:var(--muted)}
.devsec{border:1px solid var(--line);border-radius:8px;padding:14px;display:grid;gap:10px}
.devsec h3{font-size:15px}
.drop{border:2px dashed var(--line-strong);border-radius:8px;padding:18px;text-align:center;display:grid;gap:8px;justify-items:center}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}

function hasContent(o) { return o && ((o.lines || []).some(l => l.cabinetId && Number(l.qty) > 0) || (o.extras || []).some(l => l.itemId && Number(l.qty) > 0)); }
function cabRows(o) {
  const m = new Map();
  (o.lines || []).forEach(l => { const q = Number(l.qty) || 0; if (!l.cabinetId || !q) return; const c = byId(S.cabinets, l.cabinetId); const r = m.get(l.cabinetId) || { cabinetId: l.cabinetId, sku: c ? c.sku : "?", name: c ? c.name : "ארון שנמחק", qty: 0 }; r.qty += q; m.set(l.cabinetId, r); });
  return [...m.values()];
}
/* how many complete cabinets can be built from the components actually shipped to the assembler */
function buildable(o) {
  const avail = {};
  (o.shipments || []).forEach(sh => Object.entries(sh.lines || {}).forEach(([id, q]) => avail[id] = (avail[id] || 0) + (Number(q) || 0)));
  const out = {};
  cabRows(o).forEach(c => {
    const cab = byId(S.cabinets, c.cabinetId); const agg = new Map(); (cab ? cab.lines || [] : []).forEach(l => { if (l.itemId && Number(l.qty) > 0) agg.set(l.itemId, (agg.get(l.itemId) || 0) + Number(l.qty)); });
    const comps = [...agg].map(([itemId, qty]) => ({ itemId, qty }));
    let k = c.qty; const parts = [];
    comps.forEach(l => { const per = Number(l.qty), have = avail[l.itemId] || 0, fit = Math.floor(have / per); parts.push({ itemId: l.itemId, per, have, fit }); k = Math.min(k, fit); });
    if (!comps.length) k = c.qty;
    k = Math.max(0, k);
    comps.forEach(l => { avail[l.itemId] = (avail[l.itemId] || 0) - k * Number(l.qty); });
    const lacking = parts.filter(x => x.fit < c.qty).map(x => { const it = byId(S.items, x.itemId) || {}; return { ...x, sku: it.sku || "?", name: it.name || "", unit: it.unit || "יח׳", need: x.per * c.qty, miss: Math.max(0, x.per * c.qty - x.have), spare: x.have - k * x.per }; });
    out[c.cabinetId] = { complete: k, qty: c.qty, lacking };
  });
  return out;
}
function missText(o, cabIds) {
  const b = buildable(o), lines = [];
  cabRows(o).filter(c => !cabIds || cabIds.includes(c.cabinetId)).forEach(c => { const x = b[c.cabinetId]; if (!x || x.complete >= c.qty) return;
    lines.push(`ארון ${c.sku}: מהחומרים שנשלחו ניתן להרכיב ${x.complete} גמורים מתוך ${c.qty}. חסר להשלמה:`);
    x.lacking.forEach(l => lines.push(`• ${l.sku} ${l.name} – נדרש ${l.per} לארון, נשלחו ${l.have}${l.spare > 0 ? `, נשארו אצל הספק ${l.spare} ${l.unit} לארון הלא גמור` : ""}, חסרים ${l.miss} ${l.unit} להשלמת כל הארונות`)); });
  return lines.join("\n");
}
function expectedBad(o, cabId, nowQty) {
  const b = buildable(o)[cabId]; if (!b) return 0;
  const got = rcvTotals(o)[cabId] || 0, incNow = incTotals(o)[cabId] || 0;
  const completeSoFar = got - incNow;
  const completeRoom = Math.max(0, b.complete - completeSoFar);
  return Math.max(0, Math.min(nowQty, nowQty - completeRoom));
}
function incTotals(o) { const t = {}; (o.receipts || []).forEach(r => { if (r.kind === "complete") Object.entries(r.lines || {}).forEach(([id, q]) => t[id] = (t[id] || 0) - (Number(q) || 0)); else Object.entries(r.incomplete || {}).forEach(([id, q]) => t[id] = (t[id] || 0) + (Number(q) || 0)); }); Object.keys(t).forEach(k => t[k] = Math.max(0, t[k])); return t; }
function rcvTotals(o) { const t = {}; (o.receipts || []).filter(r => r.kind !== "complete").forEach(r => Object.entries(r.lines || {}).forEach(([id, q]) => t[id] = (t[id] || 0) + (Number(q) || 0))); return t; }
function logEntry(o) {

  const rcvd = rcvTotals(o);
  const incd = incTotals(o);
  const cabs = cabRows(o).map(c => ({ ...c, rcv: rcvd[c.cabinetId] || 0, inc: incd[c.cabinetId] || 0 }));
  const short = all.filter(r => r.remaining > 0).map(r => ({ itemId: r.itemId, sku: r.item.sku, name: r.item.name, unit: r.item.unit || "יח׳", req: r.qty, sup: Math.min(r.qty, r.shipped), miss: r.remaining }));
  const req = all.reduce((a, r) => a + r.qty, 0), sup = all.reduce((a, r) => a + Math.min(r.qty, r.shipped), 0);
  return { order: JSON.parse(JSON.stringify(o)), date: o.date || today(), ref: refNo(o), docType: o.docType || "", title: projLabel(o), assembler: toName(o),

}

function startDb() {

function computeBom(oArg) {

/* ---------- developer tools ---------- */
const XLSX_URL = "https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js";
let xlsxP = null;
function loadXlsx() {
  if (window.XLSX) return Promise.resolve(window.XLSX);
  if (!xlsxP) xlsxP = new Promise((res, rej) => { const sc = document.createElement("script"); sc.src = XLSX_URL; sc.onload = () => res(window.XLSX); sc.onerror = () => { xlsxP = null; rej(new Error("xlsx")); }; document.head.appendChild(sc); });
  return xlsxP;
}
function parseCsv(text) {
  const rows = []; let row = [], cur = "", q = false;
  const delim = (text.split("\n")[0].match(/;/g) || []).length > (text.split("\n")[0].match(/,/g) || []).length ? ";" : (text.includes("\t") && !text.includes(",") ? "\t" : ",");
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) { if (c === '"') { if (text[i + 1] === '"') { cur += '"'; i++; } else q = false; } else cur += c; }
    else if (c === '"') q = true;
    else if (c === delim) { row.push(cur); cur = ""; }
    else if (c === "\n" || c === "\r") { if (c === "\r" && text[i + 1] === "\n") i++; row.push(cur); rows.push(row); row = []; cur = ""; }
    else cur += c;
  }
  if (cur || row.length) { row.push(cur); rows.push(row); }
  return rows;
}
function decodeText(buf) {
  try { return new TextDecoder("utf-8", { fatal: true }).decode(buf).replace(/^\uFEFF/, ""); }
  catch (e) { try { return new TextDecoder("windows-1255").decode(buf); } catch (e2) { return new TextDecoder().decode(buf); } }
}
async function readRows(file) {
  const buf = await file.arrayBuffer();
  if (/\.(csv|txt|tsv)$/i.test(file.name)) return parseCsv(decodeText(buf));
  const X = await loadXlsx();
  const wb = X.read(buf, { type: "array" });
  const ws = wb.Sheets[wb.SheetNames[0]];
  if (!ws || !ws["!ref"]) return [];
  const rg = X.utils.decode_range(ws["!ref"]); rg.s.c = 0; rg.s.r = 0;
  return X.utils.sheet_to_json(ws, { header: 1, raw: false, defval: "", range: rg });
}
function planImport(rows) {
  const clean = rows.map(r => [String(r[1] ?? "").trim(), String(r[2] ?? "").trim()]).filter(r => r[0] || r[1]);
  let header = false;
  if (clean.length && /מק.?ט|sku|קוד|part|catalog/i.test(clean[0][0])) { header = true; clean.shift(); }
  const bySku = new Map(S.items.map(i => [String(i.sku || "").trim().toLowerCase(), i]));
  const seen = new Map(); let noSku = 0;
  for (const [sku, name] of clean) { if (!sku) { noSku++; continue; } seen.set(sku.toLowerCase(), { sku, name }); }
  const plan = [...seen.values()].map(r => {
    const ex = bySku.get(r.sku.toLowerCase());
    return { ...r, existing: ex || null, action: !ex ? "new" : (r.name && r.name !== ex.name ? "upd" : "same") };
  });
  return { plan, header, noSku, dupes: clean.filter(r => r[0]).length - seen.size };
}

  if (d && d.error) impHtml = `<div class="chip warn">${esc(d.error)}</div>`;
